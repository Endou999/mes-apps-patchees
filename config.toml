enable-module-update = true 
parallel-jobs = 1

# ==========================================
# 1. MORPHE OFFICIEL (YouTube, Music, Reddit)
# ==========================================
[YouTube-Morphe]
app-name = "YouTube"
patches-source = "MorpheApp/morphe-patches"
